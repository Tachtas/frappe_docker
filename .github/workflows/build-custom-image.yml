name: Build / Custom Frappe Image

on:
  workflow_dispatch: {}
  schedule:
    # Setiap Senin, 03:00 UTC (~10:00 WIB). Ganti sesuai kebutuhan.
    - cron: "0 3 * * 1"
  push:
    branches:
      - main
    paths:
      - apps.json
      - images/custom-ci/Containerfile
      - .github/workflows/build-custom-image.yml

env:
  REGISTRY: ghcr.io
  FRAPPE_PATH: https://github.com/frappe/frappe
  FRAPPE_BRANCH: version-16

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          # Runner arm64 native, gratis untuk repo publik (tanpa QEMU).
          # Kalau repo ini private, ganti ke: runner: ubuntu-latest
          # dan tambahkan step "Set up QEMU" sebelum "Set up Docker Buildx".
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Set lowercase image name (GHCR wajib lowercase)
        id: image
        run: |
          echo "name=$(echo '${{ github.repository_owner }}/frappe-custom' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set build tag
        id: vars
        run: |
          echo "tag=$(date -u +%Y%m%d)-${{ env.FRAPPE_BRANCH }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Jika salah satu app di apps.json ternyata private repo,
      # buat secret PAT (misal APPS_JSON_TOKEN) dan sisipkan token itu
      # ke dalam url masing-masing entry di apps.json sebelum build,
      # atau gunakan step tambahan untuk inject token sebelum langkah ini.

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/custom-ci/Containerfile
          push: true
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.vars.outputs.tag }}-${{ matrix.arch }}
          build-args: |
            FRAPPE_PATH=${{ env.FRAPPE_PATH }}
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            CACHE_BUST=${{ github.run_id }}
          secret-files: |
            apps_json=./apps.json

  manifest:
    name: Combine multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set lowercase image name (GHCR wajib lowercase)
        id: image
        run: |
          echo "name=$(echo '${{ github.repository_owner }}/frappe-custom' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set build tag
        id: vars
        run: |
          echo "tag=$(date -u +%Y%m%d)-${{ env.FRAPPE_BRANCH }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}"
          TAG="${{ steps.vars.outputs.tag }}"
          docker buildx imagetools create \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:latest" \
            "$IMAGE:$TAG-amd64" \
            "$IMAGE:$TAG-arm64"
